; LORT (UE 5.7, BigWalk build CL-24629) - UClass layout derived from a UE4SS crash dump.
; An extra 0x50 TMap sits right after ClassWithin (0xE8), shifting everything below it.
; Verified in dump: 0xE8 TMap(76) [extra], 0x144 ClassConfigName (FName idx 0xE3), 0x170 -> own CDO,
; 0x190 FuncMap (76 entries), 0x1E8 AllFunctionsCache, 0x240 Interfaces (Pawn: Num=1), 0x250 ReferenceSchema, 0x258 NativeFunctionLookupTable.
[UClass]
ClassConstructor = 0xB0
ClassVTableHelperCtorCaller = 0xB8
ClassUnique = 0xC8
FirstOwnedClassRep = 0xCC
bCooked = 0xD0
bLayoutChanging = 0xD1
ClassFlags = 0xD4
ClassCastFlags = 0xD8
ClassWithin = 0xE0
ClassConfigName = 0x144
NetFields = 0x160
ClassDefaultObject = 0x170
SparseClassData = 0x178
SparseClassDataStruct = 0x180
FuncMap = 0x190
AllFunctionsCache = 0x1E8
Interfaces = 0x240
ReferenceSchema = 0x250
NativeFunctionLookupTable = 0x258
UEP_TotalSize = 0x268

; ---- FProperty family: this build inserts 4 bytes after RepIndex/BlueprintReplicationCondition,
; so Offset_Internal is at 0x48 and every later member (incl. subclass members) is +8.
; Verified by reading live memory: Offset_Internal 0x48, PropertyLinkNext 0x50, ObjectProperty.PropertyClass 0x78,
; StructProperty.Struct 0x78, ClassProperty.MetaClass 0x80, ArrayProperty.Inner 0x80, BoolProperty.FieldSize 0x78,
; EnumProperty.UnderlyingProp 0x78 / Enum 0x80.
[FProperty]
ArrayDim = 0x30
ElementSize = 0x34
PropertyFlags = 0x38
RepIndex = 0x40
Offset_Internal = 0x48
PropertyLinkNext = 0x50
NextRef = 0x58
DestructorLinkNext = 0x60
PostConstructLinkNext = 0x68
RepNotifyFunc = 0x70
UEP_TotalSize = 0x78

[FArrayProperty]
ArrayFlags = 0x78
Inner = 0x80
UEP_TotalSize = 0x88

[FBoolProperty]
FieldSize = 0x78
ByteOffset = 0x79
ByteMask = 0x7A
FieldMask = 0x7B
UEP_TotalSize = 0x80

[FByteProperty]
Enum = 0x78
UEP_TotalSize = 0x80

[FClassProperty]
MetaClass = 0x80
UEP_TotalSize = 0x88

[FDelegateProperty]
SignatureFunction = 0x78
UEP_TotalSize = 0x80

[FEnumProperty]
UnderlyingProp = 0x78
Enum = 0x80
UEP_TotalSize = 0x88

[FFieldPathProperty]
